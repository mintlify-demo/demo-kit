# Nightly reset of the mintlify-demo org to its demo starting state.
#
# Schedule: 0 7 * * * UTC = 11:00 PM PST (UTC-8). During Pacific Daylight Time
# (typically mid-March to early November) that instant is 12:00 AM PDT. Adjust
# the cron if you want 11 PM year-round.
#
# Secret DEMO_RESET_TOKEN must be a PAT of an org member who can push to
# mintlify-demo/{docs,merge-sort-api,calculator-api,todo-api,text-utils-api,acme-app}:
#
#   Classic PAT:
#     - repo (covers public and private repositories: contents, PRs, tags)
#     - workflow is NOT required (this job does not modify workflow files)
#
#   Fine-grained PAT:
#     - Resource owner: mintlify-demo
#     - Repository access: All repositories (or at least the six named above)
#     - Permissions: Contents = Read and write, Pull requests = Read and write
#       (Metadata = Read is included automatically)
#     - Workflows / Actions are NOT required
#
# Do not put the token in this repo. Add it as the DEMO_RESET_TOKEN Actions
# secret on this repository. This workflow does not set that secret.
name: Nightly demo reset

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the kit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git and gh
        env:
          GH_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "DEMO_RESET_TOKEN is not set. Add it as a repository secret and re-run."
            exit 1
          fi
          gh auth setup-git
          git config --global user.name "DeweyMarco"
          git config --global user.email "marco@mintlify.com"
          gh auth status

      - name: Run reset
        env:
          GH_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
          GIT_AUTHOR_NAME: DeweyMarco
          GIT_AUTHOR_EMAIL: marco@mintlify.com
          GIT_COMMITTER_NAME: DeweyMarco
          GIT_COMMITTER_EMAIL: marco@mintlify.com
          SKIP_VENV: '1'
        run: ./reset.sh

      - name: Verify post-reset state
        env:
          GH_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: ./verify.sh
